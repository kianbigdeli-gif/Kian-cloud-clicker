<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Clicker</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>Cloud Clicker</h1>
  </header>

  <main id="game">
    <section id="stats">
      <p>Score: <span id="score">0</span></p>
      <p>Points per click: <span id="points-per-click">1</span></p>
    </section>

    <button id="click-target" type="button" aria-label="Click cloud"></button>

    <p id="message-area"></p>
  </main>
</body>
</html>
